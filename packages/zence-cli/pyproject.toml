[project]
name = "zence-cli"
version = "0.1.0"
description = "Zence command line interface"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [{ name = "Amir Lotfy" }]
dependencies = [
    "zence-core",
    "typer>=0.15",
    "rich>=13.9",
]

[project.scripts]
zence = "zence_cli.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/zence_cli"]
