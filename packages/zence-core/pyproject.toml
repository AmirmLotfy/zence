[project]
name = "zence-core"
version = "0.1.0"
description = "Zence policy engine, DataHub adapters, asset extraction, audit and write-back"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [{ name = "Amir Lotfy" }]
dependencies = [
    "pydantic>=2.10",
    "PyYAML>=6.0",
    "sqlglot>=26.0",
]

[project.optional-dependencies]
# Only needed when talking to a real DataHub instance. Hook fail-safe paths and
# every unit/contract test run without this installed.
datahub = ["acryl-datahub>=1.6.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/zence_core"]
