name: Bug report
description: Something behaves differently from what the docs say
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. **Please do not paste DataHub tokens, URNs from a real client
        catalog, or any customer data.** Redact freely — a redacted report is more useful than
        no report.

  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What did Zence do, and what did you expect instead?
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: Reproduction
      description: The smallest sequence that shows the problem.
      placeholder: |
        1. Open Claude Code in a workspace with .zence/policy.yaml containing …
        2. Ask Claude to …
        3. Zence returns `allow`, but ZR-004 should have returned `ask`
    validations:
      required: true

  - type: dropdown
    id: severity
    attributes:
      label: Does this cause a wrong decision?
      options:
        - "Yes — a false ALLOW (an operation that should have been asked or denied)"
        - "Yes — a false DENY (a safe operation was blocked)"
        - "No — the decision was correct, something else is wrong"
    validations:
      required: true

  - type: textarea
    id: decision
    attributes:
      label: Decision record
      description: |
        Output of `zence audit show <decision-id> --json`, redacted. This is the single most
        useful thing you can attach.
      render: json

  - type: textarea
    id: doctor
    attributes:
      label: Environment
      description: Output of `zence doctor` (it does not print secrets).
      render: shell
    validations:
      required: true
