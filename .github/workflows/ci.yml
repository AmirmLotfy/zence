name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Cancel superseded runs on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Deliberately no DataHub credentials here. Every job in this workflow must
  # pass without a catalog — unit and contract tests run on recorded fixtures.
  # Live-catalog tests live in integration.yml.
  UV_FROZEN: "1"

jobs:
  python:
    name: Python — lint, types, tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      # Includes the optional DataHub SDK. Without it mypy resolves those
      # imports through `ignore_missing_imports` and type-checks a different
      # program than a developer with the extra installed — which showed up as
      # a suppression that was necessary locally and "unused" in CI.
      - name: Sync workspace
        run: uv sync --all-packages --extra datahub

      - name: Format
        run: uv run ruff format --check .

      - name: Lint
        run: uv run ruff check --output-format=github .

      - name: Types
        run: uv run mypy

      - name: Tests
        run: uv run pytest -m "not integration and not e2e" --cov=zence_core --cov=zence_cli --cov-report=term-missing

  policy-schema:
    name: Policy validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - run: uv sync --all-packages

      # Every shipped policy must load. A policy that cannot be parsed is a
      # policy that cannot be enforced, and the failure is silent — the
      # workspace would still look protected.
      - name: Validate bundled and example policies
        run: uv run python -m zence_core.policy.validate_all

  plugin:
    name: Claude Code plugin validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"

      # Validates the marketplace manifest AND the plugin manifest. A plain
      # `plugin validate` stops at the marketplace when both live in the same
      # `.claude-plugin/` directory, which would leave plugin.json unchecked
      # behind a green tick. See the script for the workaround.
      - name: Validate manifests
        run: ./scripts/validate-plugin.sh

      - name: Hook shim is executable
        run: test -x bin/zence-hook

      - name: Hook shim is POSIX sh
        run: sh -n bin/zence-hook

  web:
    name: Website — lint, types, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm -C apps/web lint
      - run: pnpm -C apps/web typecheck
      - run: pnpm -C apps/web build

      # The site claims to render real engine output. That only stays true if
      # nobody edits an artifact by hand in the web tree — the build's sync step
      # would overwrite it, so a diff here means someone tried.
      - name: Artifacts match their source
        run: |
          ./scripts/sync-artifacts.sh
          git diff --exit-code -- apps/web/app/_artifacts \
            || { echo "::error::apps/web/app/_artifacts is out of sync with examples/artifacts/decisions"; exit 1; }

      - name: Static export produced every route
        run: |
          for route in index demo docs architecture security open-source; do
            path="apps/web/out/${route}.html"
            [ "$route" = "index" ] && path="apps/web/out/index.html"
            [ -f "$path" ] || [ -f "apps/web/out/${route}/index.html" ] \
              || { echo "::error::missing route: $route"; exit 1; }
          done
          echo "all 6 routes exported"

      - name: No external font or script requests
        run: |
          if grep -rq "fonts.googleapis\|fonts.gstatic" apps/web/out/; then
            echo "::error::the site fetches fonts from a third party; they must be self-hosted"
            exit 1
          fi
          echo "fonts are self-hosted"

  secrets:
    name: Secret scanning
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # full history — a rotated secret is still a leaked secret

      - name: gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  license:
    name: License headers and metadata
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # The hackathon requires Apache-2.0 to be *detectable* by GitHub, which means
      # LICENSE must stay byte-identical to the canonical text — placeholders in the
      # appendix included. Attribution belongs in NOTICE, per Apache-2.0 convention.
      - name: LICENSE is the canonical Apache-2.0 text
        run: |
          test -f LICENSE
          grep -q "Apache License" LICENSE
          grep -q "Version 2.0, January 2004" LICENSE
          grep -q "Copyright \[yyyy\] \[name of copyright owner\]" LICENSE

      - name: NOTICE carries the copyright
        run: |
          test -f NOTICE
          grep -q "Copyright 2026 Amir Lotfy" NOTICE

      - name: GitHub detects the license
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          spdx=$(gh api "repos/${GITHUB_REPOSITORY}" --jq '.license.spdx_id // "null"')
          echo "Detected: $spdx"
          test "$spdx" = "Apache-2.0"

      - name: Declared license matches
        run: |
          grep -q 'license = "Apache-2.0"' pyproject.toml
          grep -q 'license = "Apache-2.0"' packages/zence-core/pyproject.toml
          grep -q 'license = "Apache-2.0"' packages/zence-cli/pyproject.toml

# Jobs added as the components they validate come into existence. A CI job that
# checks a file that does not exist yet is a job that lies about coverage.
#
