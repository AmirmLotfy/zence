packages:
  - "apps/*"

# pnpm 11 requires an explicit decision on every dependency with a build script,
# and errors rather than prompting in a non-interactive shell. Declared here so
# a clean clone and CI both install unattended.
#
# Both are standard toolchain packages with native components: sharp is Next's
# image pipeline, unrs-resolver is eslint's module resolver.
allowBuilds:
  sharp: true
  unrs-resolver: true

# Patched versions of transitive dependencies flagged by `pnpm audit`. These
# reach us through next, tailwind and eslint, none of which pin them tightly,
# so an override is the right lever — waiting for four upstream releases is not
# a security posture.
#
#   sharp           <0.35.0   libvips CVEs (Next's image pipeline)
#   postcss         <8.5.18   arbitrary file read; sourceMappingURL traversal
#   brace-expansion <5.0.8    DoS via unbounded expansion
#
# brace-expansion is pinned per major rather than forced to >=5.0.8. The advisory
# names the 5.x patch, but v5 changed the export shape and eslint — which pulls
# it in through minimatch — fails with "expand is not a function". The fix is
# backported, so each consumer gets the patch for the API it expects.
overrides:
  sharp: ">=0.35.0"
  postcss: ">=8.5.18"

# GHSA-mh99-v99m-4gvg — brace-expansion DoS via unbounded expansion.
#
# Accepted, not ignored. The reasoning, so the next person can re-decide rather
# than re-discover:
#
#   * Reached only through eslint > @eslint/config-array > minimatch. It is a
#     lint-time dependency; nothing in Zence's runtime or in the published site
#     touches it.
#   * Exploiting it needs attacker-controlled glob patterns fed to eslint. The
#     patterns come from our own eslint.config.mjs.
#   * The fix exists only in 5.x, which changed the export from a function to an
#     object — forcing it makes eslint fail with "expand is not a function". The
#     1.x line is genuinely unpatched: 1.1.16 expands a small input to 1,048,576
#     items with no limit. Verified, not assumed.
#
# Dependabot will open a PR when minimatch moves to a patched major. Revisit
# then; do not extend this list without writing down why.
auditConfig:
  ignoreGhsas:
    - GHSA-mh99-v99m-4gvg
