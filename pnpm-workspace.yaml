packages:
  - "apps/*"

# pnpm 11 requires an explicit decision on every dependency with a build script,
# and errors rather than prompting in a non-interactive shell. Declared here so
# a clean clone and CI both install unattended.
#
# Both are standard toolchain packages with native components: sharp is Next's
# image pipeline, unrs-resolver is eslint's module resolver.
allowBuilds:
  sharp: true
  unrs-resolver: true

# Patched versions of transitive dependencies flagged by `pnpm audit`. These
# reach us through next, tailwind and eslint, none of which pin them tightly,
# so an override is the right lever — waiting for four upstream releases is not
# a security posture.
#
#   sharp           <0.35.0   libvips CVEs (Next's image pipeline)
#   postcss         <8.5.18   arbitrary file read; sourceMappingURL traversal
#   brace-expansion            two DoS advisories, see below
#
# brace-expansion is pinned **per major**, not forced to one version. Forcing the
# 5.x patch onto everything is what breaks eslint: v5 changed the export from a
# function to an object and eslint, which reaches it through minimatch, dies with
# "expand is not a function". Both fixes are backported, so each consumer gets
# the patch for the API it already expects.
#
#   GHSA-mh99-v99m-4gvg  unbounded expansion            1.x fixed in 1.1.17
#   GHSA-rgw5-rvv9-x895  bypasses that mitigation       1.x fixed in 1.1.18
#                                                       5.x fixed in 5.0.9
overrides:
  sharp: ">=0.35.0"
  postcss: ">=8.5.18"
  "brace-expansion@^1.0.0": "1.1.18"
  "brace-expansion@^5.0.0": "5.0.9"
